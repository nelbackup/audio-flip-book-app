<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Crocodile Who Didn't Like Water - Interactive Flipbook</title>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0f19;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      padding-bottom: 1.25rem;
    }

    header {
      width: 100%;
      background: #1e293b;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .btn-nav {
      background: #334155;
      color: #cbd5e1;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.4rem 0.8rem;
      border-radius: 9999px;
      transition: background 0.2s;
    }

    .btn-nav:hover {
      background: #475569;
      color: #fff;
    }

    .book-info h1 {
      font-size: 1rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    .book-info p {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .btn-tool {
      background: #334155;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.4rem 0.75rem;
      border-radius: 0.4rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-tool:hover {
      background: #475569;
    }

    .btn-tool.active {
      background: #4f46e5;
      border-color: #6366f1;
    }

    /* Flipbook Container */
    .stage-wrapper {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      position: relative;
    }

    #flipbook-container {
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      border-radius: 8px;
    }

    .page-item {
      background-color: #1e293b;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Audio Sync Bar */
    .audio-dock {
      width: 100%;
      max-width: 720px;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 0.75rem;
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      z-index: 10;
    }

    audio {
      flex: 1;
      height: 36px;
    }

    .page-counter {
      font-size: 0.85rem;
      font-weight: 600;
      color: #94a3b8;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-group">
      <a href="index.html" class="btn-nav">← Bookshelf</a>
      <div class="book-info">
        <h1>The Crocodile Who Didn't Like Water</h1>
        <p>Gemma Merino · 31 Pages · English Narration</p>
      </div>
    </div>

    <div class="toolbar-actions">
      <button type="button" class="btn-tool" id="btn-prev">◀ Prev</button>
      <button type="button" class="btn-tool" id="btn-next">Next ▶</button>
      <button type="button" class="btn-tool" id="btn-sync">🔄 Auto-Sync: ON</button>
    </div>
  </header>

  <main class="stage-wrapper">
    <div id="flipbook-container">
      <div id="book"></div>
    </div>
  </main>

  <div class="audio-dock">
    <div class="page-counter" id="page-display">Page 1 / 31</div>
    <audio id="soundtrack" src="soundtrack.mp3" controls preload="auto"></audio>
  </div>

  <script>
    const TOTAL_PAGES = 31;
    const bookWrapper = document.getElementById('book');
    const pageDisplay = document.getElementById('page-display');
    const prevBtn = document.getElementById('btn-prev');
    const nextBtn = document.getElementById('btn-next');
    const syncBtn = document.getElementById('btn-sync');
    const audio = document.getElementById('soundtrack');

    let autoSyncEnabled = true;

    // Populate book pages from default root pages/
    for (let i = 0; i < TOTAL_PAGES; i++) {
      const pageDiv = document.createElement('div');
      pageDiv.className = 'page-item';
      pageDiv.setAttribute('data-density', i === 0 || i === TOTAL_PAGES - 1 ? 'hard' : 'soft');

      const img = document.createElement('img');
      img.src = `pages/page-${i}.webp`;
      img.alt = `Page ${i}`;
      img.loading = i < 4 ? 'eager' : 'lazy';

      pageDiv.appendChild(img);
      bookWrapper.appendChild(pageDiv);
    }

    const pageFlip = new St.PageFlip(bookWrapper, {
      width: 550,
      height: 700,
      size: 'stretch',
      minWidth: 320,
      maxWidth: 900,
      minHeight: 420,
      maxHeight: 1100,
      maxShadowOpacity: 0.4,
      showCover: true,
      mobileScrollSupport: false,
      usePortrait: true
    });

    pageFlip.loadFromHTML(document.querySelectorAll('.page-item'));

    pageFlip.on('flip', (e) => {
      const current = e.data + 1;
      pageDisplay.innerText = `Page ${current} / ${TOTAL_PAGES}`;
    });

    prevBtn.addEventListener('click', () => pageFlip.flipPrev());
    nextBtn.addEventListener('click', () => pageFlip.flipNext());

    syncBtn.addEventListener('click', () => {
      autoSyncEnabled = !autoSyncEnabled;
      syncBtn.innerText = `🔄 Auto-Sync: ${autoSyncEnabled ? 'ON' : 'OFF'}`;
      syncBtn.classList.toggle('active', autoSyncEnabled);
    });

    const TIMESTAMPS = [
      { page: 1, time: 0 },
      { page: 2, time: 8 },
      { page: 4, time: 18 },
      { page: 6, time: 32 },
      { page: 8, time: 45 },
      { page: 10, time: 58 },
      { page: 12, time: 72 },
      { page: 14, time: 86 },
      { page: 16, time: 102 },
      { page: 18, time: 118 },
      { page: 20, time: 134 },
      { page: 22, time: 150 },
      { page: 24, time: 168 },
      { page: 26, time: 184 },
      { page: 28, time: 202 },
      { page: 30, time: 220 }
    ];

    audio.addEventListener('timeupdate', () => {
      if (!autoSyncEnabled) return;
      const t = audio.currentTime;
      for (let i = TIMESTAMPS.length - 1; i >= 0; i--) {
        if (t >= TIMESTAMPS[i].time) {
          const target = TIMESTAMPS[i].page - 1;
          if (pageFlip.getCurrentPageIndex() !== target) {
            pageFlip.flip(target);
          }
          break;
        }
      }
    });
  </script>
</body>
</html>
