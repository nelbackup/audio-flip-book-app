<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Crocodile Who Didn't Like Water - Interactive Flipbook</title>

  <!-- Strict No-Cache Headers -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- StPageFlip Engine -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0f19;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      padding-bottom: 1rem;
    }

    header {
      width: 100%;
      background: #1e293b;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.65rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .btn-nav {
      background: #334155;
      color: #cbd5e1;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      transition: background 0.2s;
    }

    .btn-nav:hover {
      background: #475569;
      color: #fff;
    }

    .book-info h1 {
      font-size: 0.95rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    .book-info p {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    /* Flipbook Stage Area */
    .stage-wrapper {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      position: relative;
    }

    #flipbook-container {
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.4s cubic-bezier(0.2, 0, 0.2, 1);
    }

    #book {
      display: none; /* revealed once initialized */
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      border-radius: 6px;
    }

    .page-item {
      background-color: #1e293b;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      background-color: #0b0f19;
    }

    /* Diagnostics Banner (Shows only if assets are missing on Vercel) */
    .diag-banner {
      display: none;
      background: rgba(225, 29, 72, 0.15);
      border: 1px solid rgba(225, 29, 72, 0.4);
      color: #fda4af;
      padding: 0.75rem 1.25rem;
      border-radius: 0.5rem;
      font-size: 0.82rem;
      max-width: 620px;
      text-align: center;
      margin: 1rem auto;
      line-height: 1.45;
    }

    /* Bottom Control & Audio Dock */
    .audio-dock {
      width: 100%;
      max-width: 820px;
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 0.75rem;
      padding: 0.6rem 1.1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      z-index: 10;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .btn-ctrl {
      background: #334155;
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.4rem 0.75rem;
      border-radius: 0.45rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .btn-ctrl:hover {
      background: #475569;
    }

    .btn-ctrl.active {
      background: #4f46e5;
      border-color: #6366f1;
    }

    .page-counter {
      font-size: 0.82rem;
      font-weight: 700;
      color: #94a3b8;
      min-width: 90px;
      text-align: center;
    }

    audio {
      flex: 1;
      height: 36px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-group">
      <a href="index.html" class="btn-nav">← Bookshelf</a>
      <div class="book-info">
        <h1>The Crocodile Who Didn't Like Water</h1>
        <p>Gemma Merino · 31 Pages · English Narration</p>
      </div>
    </div>
  </header>

  <div id="diag-box" class="diag-banner"></div>

  <main class="stage-wrapper">
    <div id="flipbook-container">
      <div id="book"></div>
    </div>
  </main>

  <div class="audio-dock">
    <button type="button" class="btn-ctrl" id="btn-prev">◀ Prev</button>
    <div class="page-counter" id="page-display">Cover</div>
    <button type="button" class="btn-ctrl" id="btn-next">Next ▶</button>
    <audio id="soundtrack" controls preload="auto"></audio>
    <button type="button" class="btn-ctrl active" id="btn-sync">🔄 Auto-Sync: ON</button>
  </div>

  <script>
    const CACHE_BUST = Date.now();
    const TOTAL_PAGES = 31; // Cover (0) + 30 pages

    const bookWrapper = document.getElementById('book');
    const container = document.getElementById('flipbook-container');
    const pageDisplay = document.getElementById('page-display');
    const prevBtn = document.getElementById('btn-prev');
    const nextBtn = document.getElementById('btn-next');
    const syncBtn = document.getElementById('btn-sync');
    const audio = document.getElementById('soundtrack');
    const diagBox = document.getElementById('diag-box');

    let autoSyncEnabled = true;
    let pageFlip = null;

    // Detect whether assets live in books/crocodile/ or root pages/
    const CANDIDATE_IMAGE_PREFIXES = [
      'books/crocodile/pages/page-',
      'pages/page-',
      'books/the-crocodile-who-didnt-like-water/pages/page-'
    ];

    const CANDIDATE_AUDIO_URLS = [
      `books/crocodile/soundtrack.mp3?v=${CACHE_BUST}`,
      `soundtrack.mp3?v=${CACHE_BUST}`,
      `books/the-crocodile-who-didnt-like-water/soundtrack.mp3?v=${CACHE_BUST}`
    ];

    function probeImage(prefix) {
      return new Promise((resolve) => {
        const testImg = new Image();
        testImg.onload = () => resolve({ ok: true, prefix });
        testImg.onerror = () => resolve({ ok: false, prefix });
        testImg.src = `${prefix}0.webp?v=${CACHE_BUST}`;
      });
    }

    async function initializeBook() {
      // 1. Locate valid image directory
      let chosenPrefix = null;
      for (const prefix of CANDIDATE_IMAGE_PREFIXES) {
        const res = await probeImage(prefix);
        if (res.ok) {
          chosenPrefix = prefix;
          break;
        }
      }

      if (!chosenPrefix) {
        // Fallback default
        chosenPrefix = 'pages/page-';
        diagBox.style.display = 'block';
        diagBox.innerHTML = `⚠️ <strong>Notice:</strong> <code>pages/page-0.webp</code> could not be found. If you moved your files into <code>books/crocodile/</code>, ensure they are committed to GitHub via <code>git add books/crocodile/</code>.`;
      }

      // 2. Setup Audio with Fallbacks
      setupAudioStream();

      // 3. Build Pages
      bookWrapper.innerHTML = '';
      for (let i = 0; i < TOTAL_PAGES; i++) {
        const pageDiv = document.createElement('div');
        pageDiv.className = 'page-item';
        pageDiv.setAttribute('data-density', (i === 0 || i === TOTAL_PAGES - 1) ? 'hard' : 'soft');

        const img = document.createElement('img');
        img.src = `${chosenPrefix}${i}.webp?v=${CACHE_BUST}`;
        img.alt = `Page ${i}`;
        img.loading = i < 4 ? 'eager' : 'lazy';

        // Secondary fallback in case single page failed
        img.onerror = () => {
          if (!img.dataset.failed) {
            img.dataset.failed = "true";
            img.src = `pages/page-${i}.webp?v=${CACHE_BUST}`;
          }
        };

        pageDiv.appendChild(img);
        bookWrapper.appendChild(pageDiv);
      }

      // 4. Initialize StPageFlip
      bookWrapper.style.display = 'block';

      pageFlip = new St.PageFlip(bookWrapper, {
        width: 550,
        height: 700,
        size: 'stretch',
        minWidth: 320,
        maxWidth: 900,
        minHeight: 420,
        maxHeight: 1100,
        maxShadowOpacity: 0.45,
        showCover: true,
        mobileScrollSupport: false,
        usePortrait: true
      });

      pageFlip.loadFromHTML(document.querySelectorAll('.page-item'));

      // Center cover when closed (page 0 or last page), center spread when opened
      function updateAlignment(pageIndex) {
        if (!pageFlip) return;
        const isLandscape = pageFlip.getOrientation() === 'landscape';

        if (isLandscape && pageIndex === 0) {
          // Closed front cover: shift left so right-hand cover aligns dead center
          container.style.transform = 'translateX(-25%)';
        } else if (isLandscape && pageIndex === TOTAL_PAGES - 1) {
          // Closed back cover
          container.style.transform = 'translateX(25%)';
        } else {
          // Open 2-page spread
          container.style.transform = 'translateX(0)';
        }

        pageDisplay.innerText = pageIndex === 0 ? 'Cover' : `Page ${pageIndex} / ${TOTAL_PAGES - 1}`;
      }

      pageFlip.on('flip', (e) => updateAlignment(e.data));
      pageFlip.on('changeOrientation', () => updateAlignment(pageFlip.getCurrentPageIndex()));

      // Initial alignment
      setTimeout(() => updateAlignment(0), 100);
    }

    function setupAudioStream() {
      let audioIndex = 0;
      audio.src = CANDIDATE_AUDIO_URLS[audioIndex];

      audio.addEventListener('error', () => {
        audioIndex++;
        if (audioIndex < CANDIDATE_AUDIO_URLS.length) {
          audio.src = CANDIDATE_AUDIO_URLS[audioIndex];
        }
      });
    }

    prevBtn.addEventListener('click', () => pageFlip && pageFlip.flipPrev());
    nextBtn.addEventListener('click', () => pageFlip && pageFlip.flipNext());

    syncBtn.addEventListener('click', () => {
      autoSyncEnabled = !autoSyncEnabled;
      syncBtn.innerText = `🔄 Auto-Sync: ${autoSyncEnabled ? 'ON' : 'OFF'}`;
      syncBtn.classList.toggle('active', autoSyncEnabled);
    });

    // Audio narration synchronization map
    const TIMESTAMPS = [
      { page: 1, time: 0 },
      { page: 2, time: 8 },
      { page: 4, time: 18 },
      { page: 6, time: 32 },
      { page: 8, time: 45 },
      { page: 10, time: 58 },
      { page: 12, time: 72 },
      { page: 14, time: 86 },
      { page: 16, time: 102 },
      { page: 18, time: 118 },
      { page: 20, time: 134 },
      { page: 22, time: 150 },
      { page: 24, time: 168 },
      { page: 26, time: 184 },
      { page: 28, time: 202 },
      { page: 30, time: 220 }
    ];

    audio.addEventListener('timeupdate', () => {
      if (!autoSyncEnabled || !pageFlip) return;
      const t = audio.currentTime;
      for (let i = TIMESTAMPS.length - 1; i >= 0; i--) {
        if (t >= TIMESTAMPS[i].time) {
          const target = TIMESTAMPS[i].page - 1;
          if (pageFlip.getCurrentPageIndex() !== target) {
            pageFlip.flip(target);
          }
          break;
        }
      }
    });

    initializeBook();
  </script>
</body>
</html>
