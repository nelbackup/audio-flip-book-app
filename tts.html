<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unified Streaming Narration Studio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0f19;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #f8fafc;
      padding: 1.5rem;
    }

    .card {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2.25rem;
      border-radius: 1.25rem;
      width: 100%;
      max-width: 680px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .card-header {
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #f8fafc;
    }

    p.subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 0.25rem;
      line-height: 1.4;
    }

    /* Provider Selector */
    .provider-toggle {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      background: #0b0f19;
      padding: 0.3rem;
      border-radius: 0.6rem;
      border: 1px solid #334155;
    }

    .provider-btn {
      flex: 1;
      background: transparent;
      color: #94a3b8;
      border: none;
      padding: 0.65rem;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 0.4rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .provider-btn.active {
      background: #4f46e5;
      color: #fff;
    }

    .form-group {
      margin-bottom: 1.15rem;
    }

    label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 0.4rem;
    }

    select, textarea {
      width: 100%;
      padding: 0.75rem 0.9rem;
      background: #0b0f19;
      border: 1px solid #334155;
      border-radius: 0.6rem;
      color: #f1f5f9;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    select:focus, textarea:focus {
      border-color: #6366f1;
    }

    textarea {
      resize: vertical;
      min-height: 140px;
      line-height: 1.5;
    }

    .stream-trigger-btn {
      width: 100%;
      background: #4f46e5;
      color: #ffffff;
      border: none;
      padding: 0.9rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 0.6rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background 0.2s, transform 0.1s;
      margin-top: 0.5rem;
    }

    .stream-trigger-btn:hover:not(:disabled) {
      background: #4338ca;
    }

    .stream-trigger-btn:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
    }

    /* Live Streaming Monitor & Player */
    .stream-monitor {
      margin-top: 1.25rem;
      background: #0b0f19;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      padding: 1.2rem;
      display: none;
    }

    .monitor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      margin-bottom: 0.75rem;
    }

    .pulse-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      margin-right: 0.4rem;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
    }

    audio {
      width: 100%;
      height: 42px;
      border-radius: 0.5rem;
      margin-top: 0.5rem;
    }

    .btn-download {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: #10b981;
      color: #ffffff;
      text-decoration: none;
      padding: 0.85rem;
      border-radius: 0.6rem;
      font-weight: 700;
      font-size: 0.95rem;
      margin-top: 1rem;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
      transition: background 0.2s;
    }

    .btn-download:hover {
      background: #059669;
    }

    .download-path-hint {
      display: none;
      font-size: 0.76rem;
      color: #94a3b8;
      text-align: center;
      margin-top: 0.5rem;
    }

    .download-path-hint code {
      color: #38bdf8;
    }

    .tier-alert {
      margin-top: 1rem;
      padding: 0.85rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.82rem;
      line-height: 1.45;
      display: none;
    }

    .tier-alert.error {
      display: block;
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fda4af;
    }

    .btn-auto-fix {
      display: inline-block;
      margin-top: 0.5rem;
      background: #e11d48;
      color: #fff;
      border: none;
      padding: 0.4rem 0.85rem;
      border-radius: 0.4rem;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-link {
      display: inline-block;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #818cf8;
      text-decoration: none;
    }

    .nav-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <h1>Unified Streaming Narration Studio</h1>
      <p class="subtitle">Direct chunked audio synthesis with embedded API backend.</p>
    </div>

    <!-- Provider Tabs -->
    <div class="provider-toggle">
      <button type="button" class="provider-btn active" id="btn-tab-eleven">🇬🇧 English (ElevenLabs)</button>
      <button type="button" class="provider-btn" id="btn-tab-cantonese">🇭🇰 Cantonese (Free Cloud MP3)</button>
    </div>

    <!-- Voice Selection -->
    <div class="form-group">
      <label for="voice-select">
        <span>Narrator Voice</span>
        <span id="voice-tag" style="color: #38bdf8; font-weight: normal; font-size: 0.75rem;">Default: Casey</span>
      </label>
      <select id="voice-select"></select>
    </div>

    <!-- Script Text Area -->
    <div class="form-group">
      <label for="story-text">
        <span>Story Script</span>
        <span id="char-counter" style="color: #94a3b8; font-size: 0.75rem;">0 characters</span>
      </label>
      <textarea id="story-text"></textarea>
    </div>

    <button class="stream-trigger-btn" id="btn-stream">⚡ Synthesize & Prepare MP3</button>

    <!-- Error / Alert Banner -->
    <div id="tier-alert-box" class="tier-alert">
      <div id="alert-text"></div>
      <button type="button" id="btn-quick-fix" class="btn-auto-fix" style="display: none;">Switch to Free-Safe Voice & Stream</button>
    </div>

    <!-- Live Streaming Monitor & Player -->
    <div class="stream-monitor" id="stream-monitor">
      <div class="monitor-header">
        <div><span class="pulse-dot"></span><strong id="stream-status">Buffering Stream...</strong></div>
        <div id="stream-stats" style="color: #94a3b8; font-size: 0.75rem;">Ready</div>
      </div>
      <audio id="audio-player" controls autoplay></audio>

      <!-- Download Button -->
      <a id="btn-download" class="btn-download" download="soundtrack.mp3" href="#">
        ⬇ Download soundtrack.mp3
      </a>
      <p id="download-hint" class="download-path-hint">
        Save the audio file to: <code>books/highway-rat/soundtrack.mp3</code>
      </p>
    </div>

    <a href="index.html" class="nav-link">← Return to Bookshelf</a>
  </div>

  <script>
    let activeProvider = 'elevenlabs';

    const tabEleven = document.getElementById('btn-tab-eleven');
    const tabCantonese = document.getElementById('btn-tab-cantonese');
    const voiceSelect = document.getElementById('voice-select');
    const voiceTag = document.getElementById('voice-tag');
    const storyText = document.getElementById('story-text');
    const charCounter = document.getElementById('char-counter');
    const streamBtn = document.getElementById('btn-stream');

    const alertBox = document.getElementById('tier-alert-box');
    const alertText = document.getElementById('alert-text');
    const quickFixBtn = document.getElementById('btn-quick-fix');

    const monitor = document.getElementById('stream-monitor');
    const streamStatus = document.getElementById('stream-status');
    const streamStats = document.getElementById('stream-stats');
    const audioPlayer = document.getElementById('audio-player');
    const downloadBtn = document.getElementById('btn-download');
    const downloadHint = document.getElementById('download-hint');

    const ENGLISH_SCRIPT = `The first day of November is a special day for Emily. It is her lucky day because she won a drawing competition at school. Draw a star on 1st November.

The next day is even more exciting. 2nd November is Emily's birthday. She will celebrate with her family and friends. Draw a birthday cake on 2nd November.`;

    const CANTONESE_SCRIPT = `早晨，各位同學！歡迎嚟到光明小學。

喺失物招領嘅枱上面，有四個書包。書包上面嘅名牌甩咗出嚟，所以我們要幫同學仔搵返佢哋嘅書包。請大家仔細聽清楚喇！

首先，我哋睇下阿妮嘅書包。阿妮同老師講，佢嘅書包唔係綠色，亦都唔係藍色。書包入面有一支水樽同三把尺。佢每日上數學堂都會用到呢啲尺。`;

    const ELEVEN_VOICES = [
      { id: "piTKgcLEGmPE4e6mEKli", name: "Casey - Clean, Crisp and Friendly (Preferred)" },
      { id: "21m00Tcm4TlvDq8ikWAM", name: "Rachel - Calm & Storybook (100% Free API Safe)" },
      { id: "Xb7hH8MSUJpSbSDYk0k2", name: "Alice - Clear Educator (100% Free API Safe)" },
      { id: "pNInz6obpgDQGcFmaJgB", name: "Adam - Warm Storyteller (100% Free API Safe)" }
    ];

    const CANTONESE_VOICES = [
      { id: "cantonese_cloud_hk", name: "🇭🇰 Hong Kong Cantonese Story Voice (Direct MP3)" },
      { id: "cantonese_cloud_tw", name: "🇨🇳 Traditional Chinese Narration (Direct MP3)" }
    ];

    function updateCounter() {
      charCounter.innerText = `${storyText.value.length} characters`;
    }
    storyText.addEventListener('input', updateCounter);

    function setProvider(provider) {
      activeProvider = provider;
      alertBox.style.display = 'none';
      monitor.style.display = 'none';

      if (provider === 'elevenlabs') {
        tabEleven.classList.add('active');
        tabCantonese.classList.remove('active');
        voiceTag.innerText = 'Default: Casey (English)';
        voiceSelect.innerHTML = ELEVEN_VOICES.map(v => `<option value="${v.id}">${v.name}</option>`).join('');
        storyText.value = ENGLISH_SCRIPT;
      } else {
        tabCantonese.classList.add('active');
        tabEleven.classList.remove('active');
        voiceTag.innerText = 'Default: Cantonese Cloud MP3';
        voiceSelect.innerHTML = CANTONESE_VOICES.map(v => `<option value="${v.id}">${v.name}</option>`).join('');
        storyText.value = CANTONESE_SCRIPT;
      }
      updateCounter();
    }

    tabEleven.addEventListener('click', () => setProvider('elevenlabs'));
    tabCantonese.addEventListener('click', () => setProvider('cantonese'));

    function showAlert(msg, isError = true, showFix = false) {
      alertText.innerHTML = msg;
      alertBox.className = `tier-alert ${isError ? 'error' : 'info'}`;
      alertBox.style.display = 'block';
      quickFixBtn.style.display = showFix ? 'inline-block' : 'none';
    }

    quickFixBtn.addEventListener('click', () => {
      voiceSelect.value = "21m00Tcm4TlvDq8ikWAM";
      alertBox.style.display = 'none';
      streamBtn.click();
    });

    streamBtn.addEventListener('click', async () => {
      const text = storyText.value.trim();
      if (!text) {
        showAlert('Please enter narration text.');
        return;
      }

      alertBox.style.display = 'none';
      streamBtn.disabled = true;
      monitor.style.display = 'block';
      downloadBtn.style.display = 'none';
      downloadHint.style.display = 'none';

      // Cantonese Path
      if (activeProvider === 'cantonese') {
        streamStatus.innerText = 'Generating Cantonese MP3 soundtrack...';
        streamStats.innerText = 'Format: audio/mp3';

        const lang = voiceSelect.value === 'cantonese_cloud_hk' ? 'zh-HK' : 'zh-TW';
        const cleanText = text.replace(/<[^>]+>/g, ' ');
        const audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=${lang}&q=${encodeURIComponent(cleanText)}`;

        audioPlayer.src = audioUrl;
        audioPlayer.play().catch(() => {});

        downloadBtn.href = audioUrl;
        downloadBtn.setAttribute('download', 'soundtrack.mp3');
        downloadBtn.style.display = 'flex';
        downloadHint.style.display = 'block';

        streamStatus.innerText = 'Cantonese audio ready to play & download!';
        streamBtn.disabled = false;
        return;
      }

      // ElevenLabs Server-Side Streamed Path
      streamStatus.innerText = 'Connecting to ElevenLabs stream...';
      streamStats.innerText = 'Received: 0 KB';

      try {
        const response = await fetch('/api/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text: text,
            voice_id: voiceSelect.value
          })
        });

        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          const errMsg = err?.detail?.message || `HTTP ${response.status}`;

          if (errMsg.includes('library voices') || errMsg.includes('Free users')) {
            throw new Error('FREE_TIER_LIBRARY_VOICE');
          }
          throw new Error(errMsg);
        }

        const reader = response.body.getReader();
        const chunks = [];
        let totalBytes = 0;

        streamStatus.innerText = 'Streaming audio chunks...';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          totalBytes += value.length;
          streamStats.innerText = `Received: ${(totalBytes / 1024).toFixed(1)} KB`;
        }

        const audioBlob = new Blob(chunks, { type: 'audio/mpeg' });
        const audioUrl = URL.createObjectURL(audioBlob);

        audioPlayer.src = audioUrl;
        audioPlayer.play().catch(() => {});

        downloadBtn.href = audioUrl;
        downloadBtn.setAttribute('download', 'soundtrack.mp3');
        downloadBtn.style.display = 'flex';
        downloadHint.style.display = 'block';

        streamStatus.innerText = 'Playback & MP3 download ready!';

      } catch (err) {
        monitor.style.display = 'none';
        if (err.message === 'FREE_TIER_LIBRARY_VOICE') {
          showAlert(
            `<strong>ElevenLabs Free Tier Policy:</strong> <em>Casey</em> is a community library voice and cannot be accessed via API on Free accounts. Default premade voices (Rachel, Alice, Adam) are supported.`,
            true,
            true
          );
        } else {
          showAlert(`Error: ${err.message}`);
        }
      } finally {
        streamBtn.disabled = false;
      }
    });

    setProvider('elevenlabs');
  </script>
</body>
</html>
