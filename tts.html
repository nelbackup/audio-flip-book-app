<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Narration Recording Studio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0f19;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      color: #f8fafc;
      overflow: hidden;
    }

    /* Top Studio Header */
    header.studio-header {
      background: #1e293b;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.6rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      z-index: 10;
      flex-shrink: 0;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .btn-back {
      background: #334155;
      color: #cbd5e1;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      transition: background 0.2s;
    }

    .btn-back:hover {
      background: #475569;
      color: #fff;
    }

    .studio-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    /* Provider Switcher Tabs */
    .provider-nav {
      display: flex;
      background: #0f172a;
      padding: 0.25rem;
      border-radius: 0.5rem;
      border: 1px solid #334155;
      gap: 0.35rem;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.4rem 0.9rem;
      border-radius: 0.35rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #4f46e5;
      color: #ffffff;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .btn-launch-external {
      background: #10b981;
      color: #ffffff;
      border: none;
      padding: 0.4rem 0.85rem;
      border-radius: 0.4rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: background 0.2s;
    }

    .btn-launch-external:hover {
      background: #059669;
    }

    /* Full-Screen Iframe Stage */
    .iframe-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #0f172a;
      width: 100%;
      height: calc(100vh - 52px);
    }

    .info-banner {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 0.5rem 1.25rem;
      font-size: 0.8rem;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .info-banner strong {
      color: #38bdf8;
    }

    iframe#portal-frame {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <!-- Top Studio Header -->
  <header class="studio-header">
    <div class="brand-section">
      <a href="index.html" class="btn-back">← Bookshelf</a>
      <span class="studio-title">🎙️ Narration Recording Studio</span>
    </div>

    <!-- Provider Navigation Tabs -->
    <div class="provider-nav">
      <button
        type="button"
        class="tab-btn active"
        id="tab-eleven"
        data-url="https://elevenlabs.io/app/speech-synthesis/text-to-speech"
      >
        🇬🇧 English (ElevenLabs · Casey)
      </button>
      <button
        type="button"
        class="tab-btn"
        id="tab-minimax"
        data-url="https://www.minimax.io/audio"
      >
        🇭🇰 Chinese / Cantonese (MiniMax · Professional Reporter)
      </button>
    </div>

    <div class="header-actions">
      <button type="button" class="btn-launch-external" id="btn-open-companion">
        ↗ Open Live Studio
      </button>
    </div>
  </header>

  <!-- Full-Width Embedded Portal Area -->
  <main class="iframe-stage">
    <div class="info-banner">
      <span id="active-url-display">Active: https://elevenlabs.io/app/speech-synthesis/text-to-speech [Default: Casey]</span>
      <span id="voice-hint">Target Voice: <strong>Casey - Clean, Crisp and Friendly</strong></span>
    </div>

    <iframe
      id="portal-frame"
      src="https://elevenlabs.io/app/speech-synthesis/text-to-speech"
      allow="clipboard-read; clipboard-write; microphone; autoplay"
      sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals allow-downloads"
    ></iframe>
  </main>

  <script>
    const portalFrame = document.getElementById('portal-frame');
    const tabEleven = document.getElementById('tab-eleven');
    const tabMiniMax = document.getElementById('tab-minimax');
    const urlDisplay = document.getElementById('active-url-display');
    const voiceHint = document.getElementById('voice-hint');
    const openBtn = document.getElementById('btn-open-companion');

    const ELEVEN_URL = "https://elevenlabs.io/app/speech-synthesis/text-to-speech";
    const MINIMAX_URL = "https://www.minimax.io/audio";

    let currentUrl = ELEVEN_URL;

    function switchTab(target) {
      if (target === 'eleven') {
        currentUrl = ELEVEN_URL;
        portalFrame.src = ELEVEN_URL;
        tabEleven.classList.add('active');
        tabMiniMax.classList.remove('active');
        urlDisplay.innerText = `Active: ${ELEVEN_URL} [Default: Casey]`;
        voiceHint.innerHTML = `Target Voice: <strong>Casey - Clean, Crisp and Friendly</strong>`;
      } else {
        currentUrl = MINIMAX_URL;
        portalFrame.src = MINIMAX_URL;
        tabMiniMax.classList.add('active');
        tabEleven.classList.remove('active');
        urlDisplay.innerText = `Active: ${MINIMAX_URL} [Default: Professional Reporter]`;
        voiceHint.innerHTML = `Target Voice: <strong>Professional Reporter - Precise,Objective,Bright</strong>`;
      }
    }

    tabEleven.addEventListener('click', () => switchTab('eleven'));
    tabMiniMax.addEventListener('click', () => switchTab('minimax'));

    openBtn.addEventListener('click', () => {
      const w = 1280;
      const h = 880;
      const left = window.screen.width - w;
      const top = 60;
      window.open(currentUrl, 'StudioLive', `width=${w},height=${h},left=${left},top=${top},menubar=no,status=no,toolbar=no`);
    });
  </script>
</body>
</html>
