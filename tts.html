<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Storybook Narration Generator (TTS)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      padding: 1.5rem;
    }
    .card {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2rem;
      border-radius: 1.25rem;
      width: 100%;
      max-width: 640px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1.25rem;
    }
    h1 { font-size: 1.35rem; font-weight: 700; color: #f8fafc; }
    p.subtitle { font-size: 0.85rem; color: #94a3b8; margin-top: 0.25rem; }
    .auth-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid #334155;
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #94a3b8;
      cursor: pointer;
    }
    .auth-badge.authenticated {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.4);
      color: #34d399;
    }
    .provider-toggle {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      background: #0b0f19;
      padding: 0.3rem;
      border-radius: 0.6rem;
      border: 1px solid #334155;
    }
    .provider-btn {
      flex: 1;
      background: transparent;
      color: #94a3b8;
      border: none;
      padding: 0.55rem;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 0.4rem;
      cursor: pointer;
    }
    .provider-btn.active { background: #4f46e5; color: #fff; }
    .form-group { margin-bottom: 1rem; }
    label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 600; color: #cbd5e1; margin-bottom: 0.35rem; }
    select, textarea, input[type="text"], input[type="password"] {
      width: 100%;
      padding: 0.75rem 0.9rem;
      background: #0b0f19;
      border: 1px solid #334155;
      border-radius: 0.6rem;
      color: #f1f5f9;
      font-size: 0.88rem;
      outline: none;
      font-family: inherit;
    }
    textarea { resize: vertical; min-height: 140px; line-height: 1.5; }
    .btn-submit {
      width: 100%;
      background: #4f46e5;
      color: #ffffff;
      border: none;
      padding: 0.85rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 0.6rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .btn-submit:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
    .status-msg { margin-top: 1rem; padding: 0.75rem 1rem; border-radius: 0.5rem; font-size: 0.85rem; display: none; }
    .status-msg.error { display: block; background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.3); color: #fda4af; }
    .status-msg.info { display: block; background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.3); color: #c7d2fe; }
    .result-section { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid rgba(255, 255, 255, 0.08); display: none; }
    audio { width: 100%; height: 42px; margin-bottom: 1rem; }
    .btn-download {
      display: block;
      text-align: center;
      background: #10b981;
      color: #ffffff;
      text-decoration: none;
      padding: 0.75rem;
      border-radius: 0.5rem;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .nav-link { display: inline-block; margin-top: 1.5rem; font-size: 0.85rem; color: #818cf8; text-decoration: none; }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center; padding: 1.5rem; z-index: 1000;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #1e293b; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 1rem;
      padding: 2rem; width: 100%; max-width: 480px;
    }
    .modal h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.35rem; color: #f8fafc; }
    .modal p { font-size: 0.8rem; color: #94a3b8; line-height: 1.4; margin-bottom: 1.5rem; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem; }
    .btn-cancel { background: #334155; color: #cbd5e1; border: none; padding: 0.65rem 1.2rem; border-radius: 0.5rem; cursor: pointer; }
    .btn-confirm { background: #4f46e5; color: #fff; border: none; padding: 0.65rem 1.25rem; border-radius: 0.5rem; cursor: pointer; }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <div>
        <h1>Narration Studio</h1>
        <p class="subtitle">Generate high-fidelity audio narration for your storybooks.</p>
      </div>
      <button type="button" id="auth-status-btn" class="auth-badge">
        <span id="auth-dot">⚪</span> <span id="auth-label">Connect API</span>
      </button>
    </div>

    <div class="provider-toggle">
      <button type="button" class="provider-btn active" id="btn-tab-eleven">ElevenLabs (Free API Tier)</button>
      <button type="button" class="provider-btn" id="btn-tab-browser">Browser Native (Cantonese / No Key)</button>
    </div>

    <!-- Voice Selection -->
    <div class="form-group">
      <label for="voice-select">
        <span>Narrator Voice</span>
        <span id="voice-desc" style="color: #34d399; font-size: 0.75rem;">Free Tier Supported</span>
      </label>
      <select id="voice-select">
        <option value="21m00Tcm4TlvDq8ikWAM" selected>Rachel - Calm, Natural & Storybook</option>
        <option value="Xb7hH8MSUJpSbSDYk0k2">Alice - Clear & Friendly Educator</option>
        <option value="EXAVITQu4vr4xnSDxMaL">Bella - Soft & Gentle</option>
        <option value="ErXwobaYiN019PkySvjV">Antoni - Lively & Engaging</option>
        <option value="pNInz6obpgDQGcFmaJgB">Adam - Warm & Deep</option>
      </select>
    </div>

    <!-- Text Area -->
    <div class="form-group">
      <label for="story-text">Story Script (Supports SSML Break Timing)</label>
      <textarea id="story-text">Good morning, students! Welcome to Luminous Minds School.

<break time="3s" /> <break time="3s" /> <break time="2s" />

There are four school bags on the Lost and Found table. The names have fallen off, so we need to help the students find their bags. Listen carefully because there is a lot of information to remember!

<break time="3s" /> <break time="3s" /> <break time="2s" />

First, let's look at Annie's bag. Annie told the teacher that her bag is not green or blue. Inside her bag, there is one water bottle and three rulers. She uses the rulers in her Maths lessons every day.</textarea>
    </div>

    <button class="btn-submit" id="btn-generate">🎙️ Synthesize Narration</button>

    <div id="status-box" class="status-msg"></div>

    <div id="result-box" class="result-section">
      <audio id="audio-player" controls></audio>
      <a id="download-audio-btn" class="btn-download" download="soundtrack.mp3">⬇ Download soundtrack.mp3</a>
    </div>

    <a href="index.html" class="nav-link">← Return to Bookshelf</a>
  </div>

  <!-- In-Memory Auth Modal -->
  <div id="login-modal" class="modal-backdrop">
    <div class="modal">
      <h2>ElevenLabs API Key</h2>
      <p>Enter your secret key starting with <strong>sk_</strong>. Held strictly in volatile memory for this browser session.</p>
      <div class="form-group">
        <input type="password" id="modal-key-input" placeholder="sk_..." autocomplete="off" />
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="btn-modal-cancel">Cancel</button>
        <button type="button" class="btn-confirm" id="btn-modal-save">Use for Session</button>
      </div>
    </div>
  </div>

  <script>
    let sessionKey = null;
    let activeProvider = 'elevenlabs';

    const modal = document.getElementById('login-modal');
    const authBtn = document.getElementById('auth-status-btn');
    const authDot = document.getElementById('auth-dot');
    const authLabel = document.getElementById('auth-label');
    const modalKeyInput = document.getElementById('modal-key-input');
    const modalCancel = document.getElementById('btn-modal-cancel');
    const modalSave = document.getElementById('btn-modal-save');

    const tabEleven = document.getElementById('btn-tab-eleven');
    const tabBrowser = document.getElementById('btn-tab-browser');
    const voiceSelect = document.getElementById('voice-select');
    const voiceDesc = document.getElementById('voice-desc');
    const storyText = document.getElementById('story-text');
    const generateBtn = document.getElementById('btn-generate');
    const statusBox = document.getElementById('status-box');
    const resultBox = document.getElementById('result-box');
    const audioPlayer = document.getElementById('audio-player');
    const downloadBtn = document.getElementById('download-audio-btn');

    const ELEVEN_VOICES = [
      { id: "21m00Tcm4TlvDq8ikWAM", name: "Rachel - Calm, Natural & Storybook" },
      { id: "Xb7hH8MSUJpSbSDYk0k2", name: "Alice - Clear & Friendly Educator" },
      { id: "EXAVITQu4vr4xnSDxMaL", name: "Bella - Soft & Gentle" },
      { id: "ErXwobaYiN019PkySvjV", name: "Antoni - Lively & Engaging" },
      { id: "pNInz6obpgDQGcFmaJgB", name: "Adam - Warm & Deep" }
    ];

    let browserVoices = [];
    function loadBrowserVoices() {
      browserVoices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
    }
    if ('speechSynthesis' in window) {
      loadBrowserVoices();
      window.speechSynthesis.onvoiceschanged = loadBrowserVoices;
    }

    function updateAuthBadge() {
      if (sessionKey) {
        authBtn.classList.add('authenticated');
        authDot.innerText = '🟢';
        authLabel.innerText = 'Session Active';
      } else {
        authBtn.classList.remove('authenticated');
        authDot.innerText = '⚪';
        authLabel.innerText = 'Connect API';
      }
    }

    authBtn.addEventListener('click', () => {
      modalKeyInput.value = sessionKey || '';
      modal.classList.add('open');
      modalKeyInput.focus();
    });

    modalCancel.addEventListener('click', () => modal.classList.remove('open'));

    modalSave.addEventListener('click', () => {
      const key = modalKeyInput.value.trim();
      if (!key.startsWith('sk_')) {
        alert('Please enter a valid ElevenLabs secret key starting with sk_');
        return;
      }
      sessionKey = key;
      updateAuthBadge();
      modal.classList.remove('open');
    });

    function setProvider(provider) {
      activeProvider = provider;
      statusBox.style.display = 'none';
      resultBox.style.display = 'none';

      if (provider === 'elevenlabs') {
        tabEleven.classList.add('active');
        tabBrowser.classList.remove('active');
        authBtn.style.display = 'inline-flex';
        voiceDesc.innerText = 'Free Tier Supported';
        voiceSelect.innerHTML = ELEVEN_VOICES.map(v => `<option value="${v.id}">${v.name}</option>`).join('');
      } else {
        tabBrowser.classList.add('active');
        tabEleven.classList.remove('active');
        authBtn.style.display = 'none';
        voiceDesc.innerText = 'Local Device Voice';

        const cantoneseVoices = browserVoices.filter(v => v.lang.includes('HK') || v.lang.includes('yue') || v.lang.includes('zh'));
        const voicesToUse = cantoneseVoices.length > 0 ? cantoneseVoices : browserVoices;

        voiceSelect.innerHTML = voicesToUse.map((v, i) => `<option value="${i}">${v.name} (${v.lang})</option>`).join('');
        if (voicesToUse.length === 0) {
          voiceSelect.innerHTML = '<option value="">Default System Voice</option>';
        }
      }
    }

    tabEleven.addEventListener('click', () => setProvider('elevenlabs'));
    tabBrowser.addEventListener('click', () => setProvider('browser'));

    function showStatus(msg, isError = false) {
      statusBox.className = `status-msg ${isError ? 'error' : 'info'}`;
      statusBox.innerText = msg;
      statusBox.style.display = 'block';
    }

    generateBtn.addEventListener('click', async () => {
      const text = storyText.value.trim();
      if (!text) {
        showStatus('Please enter narration text.', true);
        return;
      }

      if (activeProvider === 'browser') {
        if (!('speechSynthesis' in window)) {
          showStatus('Your browser does not support speech synthesis.', true);
          return;
        }
        window.speechSynthesis.cancel();
        // Strip SSML tags for plain browser voice
        const cleanText = text.replace(/<[^>]+>/g, ' ... ');
        const utter = new SpeechSynthesisUtterance(cleanText);
        utter.rate = 0.85;
        if (voiceSelect.value && browserVoices[parseInt(voiceSelect.value)]) {
          utter.voice = browserVoices[parseInt(voiceSelect.value)];
        }
        window.speechSynthesis.speak(utter);
        showStatus('Playing audio via native device synthesizer.');
        return;
      }

      // ElevenLabs Free API Path
      if (!sessionKey) {
        modal.classList.add('open');
        return;
      }

      generateBtn.disabled = true;
      resultBox.style.display = 'none';
      showStatus('Synthesizing audio via ElevenLabs...');

      try {
        const resp = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceSelect.value}`, {
          method: 'POST',
          headers: {
            'xi-api-key': sessionKey,
            'Content-Type': 'application/json',
            'Accept': 'audio/mpeg'
          },
          body: JSON.stringify({
            text: text,
            model_id: "eleven_multilingual_v2",
            voice_settings: { stability: 0.5, similarity_boost: 0.75 }
          })
        });

        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          throw new Error(err?.detail?.message || `HTTP ${resp.status}`);
        }

        const blob = await resp.blob();
        const audioUrl = URL.createObjectURL(blob);
        audioPlayer.src = audioUrl;
        downloadBtn.href = audioUrl;
        resultBox.style.display = 'block';
        audioPlayer.play().catch(() => {});
        showStatus('Audio synthesized successfully!');
      } catch (err) {
        showStatus(`Error: ${err.message}`, true);
      } finally {
        generateBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
